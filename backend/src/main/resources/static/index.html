<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C-3PO · What are the odds?</title>
    <style>
        :root {
            --ivory: #f4ecda;
            --paper: #fffaf0;
            --ink: #2e2419;
            --muted: #75654f;
            --gold: #c9a227;
            --gold-dark: #8a6a1c;
            --gold-light: #e3cf9b;
            --safe: #2f7d4f;
            --risky: #b26a00;
            --doomed: #b23a2e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at top, var(--paper), var(--ivory) 70%);
            color: var(--ink);
            font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        }

        main {
            box-sizing: border-box;
            width: 100%;
            max-width: 30rem;
            padding: 2.5rem 2rem;
            border: 1px solid var(--gold-light);
            border-radius: 4px;
            /* A second, inner gold frame, like an engraved plate. */
            outline: 1px solid var(--gold-light);
            outline-offset: -10px;
            background: var(--paper);
            box-shadow: 0 12px 40px rgba(80, 60, 20, 0.15);
            text-align: center;
        }

        .droid {
            margin: 0;
            font-size: 0.8rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .role { margin: 0.3rem 0 0; font-style: italic; color: var(--muted); }

        h1 { margin: 1.25rem 0 1.5rem; font-size: 2.2rem; font-weight: normal; }

        .dropzone {
            padding: 1.25rem 1rem;
            border: 1px dashed var(--gold);
            border-radius: 4px;
        }

        .dropzone p { margin: 0 0 0.75rem; color: var(--muted); }

        .file-button {
            position: relative;
            display: inline-block;
            padding: 0.55rem 1.4rem;
            border-radius: 4px;
            background: var(--gold);
            color: var(--ink);
            font-weight: bold;
            cursor: pointer;
        }

        /* The real input stays in the page, invisible, so the keyboard can still reach it. */
        .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }

        .file-button:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }

        .file-name { margin: 0.75rem 0 0; font-size: 0.85rem; color: var(--muted); }

        .odds {
            margin: 1.75rem 0 0;
            font-size: 5rem;
            line-height: 1;
            /* Every digit takes the same width, so the number does not wobble as it counts. */
            font-variant-numeric: tabular-nums;
            color: var(--level, var(--gold));
            transition: color 0.3s;
        }

        /* The script only sets data-level; each level picks its colour here. */
        .result[data-level="safe"] { --level: var(--safe); }
        .result[data-level="risky"] { --level: var(--risky); }
        .result[data-level="doomed"] { --level: var(--doomed); }

        .quote { margin: 1.25rem 0 0; font-style: italic; color: var(--muted); }
        .quote::before { content: "“"; }
        .quote::after { content: "”"; }

        .error { margin: 1.25rem 0 0; color: var(--doomed); }
    </style>
</head>

<body>
    <main>
        <p class="droid">✦ C-3PO ✦</p>
        <p class="role">Human–cyborg · Odds calculator</p>
        <h1>What are the odds?</h1>

        <div class="dropzone">
            <p>Drop the intercepted plans anywhere, or</p>
            <label class="file-button">
                <input type="file" id="empire-plan" accept=".json">
                choose a file
            </label>
            <p class="file-name" id="file-name">No file selected</p>
        </div>

        <section class="result" id="result">
            <p class="odds" id="odds">–</p>
            <p class="quote" id="quote" aria-live="polite">Sir, give me the intercepted plans and I shall calculate the odds.</p>
        </section>

        <p class="error" id="error" role="alert"></p>
    </main>

    <script>
        const IDLE_QUOTE = 'Sir, give me the intercepted plans and I shall calculate the odds.';

        const fileInput = document.getElementById('empire-plan');
        const fileName = document.getElementById('file-name');
        const result = document.getElementById('result');
        const oddsOutput = document.getElementById('odds');
        const quote = document.getElementById('quote');
        const errorOutput = document.getElementById('error');

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) {
                return;
            }
            fileName.textContent = file.name;

            // Start from a blank result for every new file.
            oddsOutput.textContent = '–';
            quote.textContent = IDLE_QUOTE;
            delete result.dataset.level;
            errorOutput.textContent = '';

            try {
                const response = await fetch('/api/odds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: await file.text()
                });

                if (response.status === 400) {
                    const failure = await response.json();
                    errorOutput.textContent = 'Oh dear! Invalid empire plan: ' + failure.error;
                    return;
                }

                if (!response.ok) {
                    errorOutput.textContent = 'Oh dear! The onboard computer failed to compute the odds.';
                    return;
                }

                const res = await response.json();
                showOdds(res.odds);

            } catch (networkError) {
                errorOutput.textContent = 'Oh dear! I cannot reach the onboard computer.';
            }
        });

        // A file dropped anywhere on the page goes into the file input, as if it had been
        // chosen there. preventDefault stops the browser from opening it in the tab.
        document.addEventListener('dragover', event => event.preventDefault());
        document.addEventListener('drop', event => {
            event.preventDefault();
            fileInput.files = event.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        function showOdds(odds) {
            // Same rule as the command line: 0% is kept for an unreachable target.
            const percentage = odds > 0 ? Math.max(1, Math.round(odds * 100)) : 0;
            countUp(percentage);

            if (percentage === 0) {
                result.dataset.level = 'doomed';
                quote.textContent = 'Sir, Endor cannot be reached before the Death Star fires. We’re doomed!';
            } else if (percentage === 100) {
                result.dataset.level = 'safe';
                quote.textContent = 'Sir, a clear path to Endor, without a single bounty hunter. How fortunate!';
            } else {
                result.dataset.level = 'risky';
                quote.textContent = 'Sir, I calculate the odds of reaching Endor at ' + percentage
                        + '%. Bounty hunters lie in wait. I have a bad feeling about this.';
            }
        }

        // Shows the percentage climbing from 0 to its value, two points at a time.
        let counter;
        function countUp(target) {
            clearInterval(counter);
            let shown = 0;
            counter = setInterval(() => {
                shown = Math.min(target, shown + 2);
                oddsOutput.textContent = shown + '%';
                if (shown === target) {
                    clearInterval(counter);
                }
            }, 15);
        }
    </script>
</body>
</html>
