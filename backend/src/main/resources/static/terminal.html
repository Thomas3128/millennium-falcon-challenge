<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nav computer · What are the odds?</title>
    <style>
        :root {
            --screen: #0b0b08;
            --amber: #ffb000;
            --dim: #a7781a;
            --safe: #5dff8a;
            --risky: #ffb000;
            --doomed: #ff5a4f;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at center, #1a1508, var(--screen) 70%);
            color: var(--amber);
            font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
            /* The phosphor glow of an old monitor. */
            text-shadow: 0 0 6px rgba(255, 176, 0, 0.45);
        }

        /* Thin dark lines over the whole page, like the scanlines of a CRT screen. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
        }

        main {
            box-sizing: border-box;
            width: 100%;
            max-width: 38rem;
            padding: 1.5rem 1.75rem;
            border: 1px solid var(--dim);
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(255, 176, 0, 0.15), inset 0 0 40px rgba(255, 176, 0, 0.06);
        }

        main p { margin: 0.4rem 0; white-space: pre-wrap; }

        .dim { color: var(--dim); }

        hr { border: none; border-top: 1px dashed var(--dim); margin: 1rem 0; }

        .file-button { position: relative; cursor: pointer; white-space: nowrap; }
        .file-button:hover { background: var(--amber); color: var(--screen); text-shadow: none; }

        /* The real input stays in the page, invisible, so the keyboard can still reach it. */
        .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .file-button:focus-within { outline: 1px solid var(--amber); }

        .result { margin-top: 1rem; }

        #odds-line, #bar-line { color: var(--level, var(--amber)); }

        /* The script only sets data-level; each level picks its colour here. */
        .result[data-level="safe"] { --level: var(--safe); }
        .result[data-level="risky"] { --level: var(--risky); }
        .result[data-level="doomed"] { --level: var(--doomed); }

        /* A blinking cursor after the last line. */
        .cursor::after { content: "_"; animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .error { color: var(--doomed); }
    </style>
</head>

<body>
    <main>
        <p class="dim">MILLENNIUM FALCON // NAV COMPUTER v1.0</p>
        <p class="dim">C-3PO HUMAN-CYBORG RELATIONS MODULE ... ONLINE</p>
        <hr>
        <p>&gt; LOAD EMPIRE PLANS</p>
        <p class="dim">  drop a file anywhere, or <label class="file-button">[ SELECT FILE ]<input type="file" id="empire-plan" accept=".json"></label></p>

        <section class="result" id="result" aria-live="polite">
            <p class="dim" id="file-line"></p>
            <p id="odds-line"></p>
            <p id="bar-line"></p>
            <p class="cursor" id="droid-line">&gt; AWAITING EMPIRE PLANS</p>
        </section>

        <p class="error" id="error" role="alert"></p>
    </main>

    <script>
        const fileInput = document.getElementById('empire-plan');
        const result = document.getElementById('result');
        const fileLine = document.getElementById('file-line');
        const oddsLine = document.getElementById('odds-line');
        const barLine = document.getElementById('bar-line');
        const droidLine = document.getElementById('droid-line');
        const errorOutput = document.getElementById('error');

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) {
                return;
            }

            // Start from a blank screen for every new file.
            fileLine.textContent = '> FILE ' + file.name;
            oddsLine.textContent = '> COMPUTING ODDS...';
            barLine.textContent = '';
            type('');
            delete result.dataset.level;
            errorOutput.textContent = '';

            try {
                const response = await fetch('/api/odds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: await file.text()
                });

                if (response.status === 400) {
                    const failure = await response.json();
                    fail('INVALID EMPIRE PLAN: ' + failure.error);
                    return;
                }

                if (!response.ok) {
                    fail('THE ONBOARD COMPUTER FAILED TO COMPUTE THE ODDS');
                    return;
                }

                const res = await response.json();
                showOdds(res.odds);

            } catch (networkError) {
                fail('CANNOT REACH THE ONBOARD COMPUTER');
            }
        });

        // A file dropped anywhere on the page goes into the file input, as if it had been
        // chosen there. preventDefault stops the browser from opening it in the tab.
        document.addEventListener('dragover', event => event.preventDefault());
        document.addEventListener('drop', event => {
            event.preventDefault();
            fileInput.files = event.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        function showOdds(odds) {
            // Same rule as the command line: 0% is kept for an unreachable target.
            const percentage = odds > 0 ? Math.max(1, Math.round(odds * 100)) : 0;

            // A 20-character gauge: one block for every 5%.
            const blocks = Math.round(percentage / 5);
            oddsLine.textContent = '> ODDS OF REACHING ENDOR: ' + percentage + '%';
            barLine.textContent = '  [' + '█'.repeat(blocks) + '░'.repeat(20 - blocks) + ']';

            if (percentage === 0) {
                result.dataset.level = 'doomed';
                type('C-3PO> Endor cannot be reached in time. We’re doomed!');
            } else if (percentage === 100) {
                result.dataset.level = 'safe';
                type('C-3PO> A clear path, Sir. Not a single bounty hunter. How fortunate!');
            } else {
                result.dataset.level = 'risky';
                type('C-3PO> Bounty hunters lie in wait. I have a bad feeling about this.');
            }
        }

        function fail(message) {
            oddsLine.textContent = '';
            errorOutput.textContent = '> ERROR: ' + message;
        }

        // Writes C-3PO's line one character at a time, like a terminal printing it.
        let typing;
        function type(text) {
            clearInterval(typing);
            let shown = 0;
            droidLine.textContent = '';
            typing = setInterval(() => {
                if (shown === text.length) {
                    clearInterval(typing);
                    return;
                }
                shown++;
                droidLine.textContent = text.slice(0, shown);
            }, 25);
        }
    </script>
</body>
</html>
